<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111113"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MyTube — 自分だけのライブラリ</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body><header><a class="brand" href="#"><span class="logo">▶</span>MyTube<span class="badge">PERSONAL</span></a><label class="search"><span>⌕</span><input id="search" type="search" placeholder="ライブラリ全体を検索" aria-label="ファイル・フォルダを検索"></label><button id="help" aria-label="使い方と保存について">ⓘ</button></header>
<div class="layout"><aside><p class="eyebrow">あなたのライブラリ</p><nav><button data-go="home">⌂ <span>ホーム</span></button><button data-go="video">▣ <span>ビデオ</span></button><button data-go="audio">♫ <span>音声</span></button></nav><div class="aside-bottom"><span class="local-dot"></span> このデバイスに保存<p>メディアは外部へ送信しません</p><small id="usage">保存容量を確認中…</small><button id="persist">保存の保護をリクエスト</button></div></aside>
<main><div class="topline"><nav id="crumbs" aria-label="パンくずリスト"></nav><span id="connection" class="status">準備中</span></div><section class="heading"><div><p class="eyebrow" id="kicker">YOUR PERSONAL COLLECTION</p><h1 id="title">ライブラリ</h1><p id="subtitle">お気に入りの瞬間も、いつもの音楽も。ここに。</p></div><div class="actions"><button id="new-folder">＋ フォルダ</button><button id="import" class="primary">＋ ファイルを追加</button></div></section>
<input id="file-input" type="file" accept=".mp4,.mp3,video/mp4,audio/mpeg" multiple hidden><div id="import-status" role="status" hidden></div><div class="section-label"><h2 id="section-title">フォルダ</h2><select id="sort" aria-label="並び順"><option value="name">名前順</option><option value="date">追加した順</option></select></div><div id="grid" class="grid"></div><div id="empty" hidden><div class="empty-icon">＋</div><h2>ここから、コレクションを。</h2><p>「ファイルを追加」からMP4・MP3を取り込めます。<br>フォルダを作って、自分らしく整理しましょう。</p></div><footer>端末の容量不足やSafariのデータ削除で、保存内容が消える場合があります。元のファイルは「ファイル」アプリにも保管してください。</footer></main></div>
<dialog id="modal"><form id="modal-form"><div class="dialog-head"><h2 id="modal-title"></h2><button type="button" id="modal-close" aria-label="閉じる">✕</button></div><div id="modal-body"></div><div id="modal-actions"></div></form></dialog>
<dialog id="player"><div class="dialog-head"><div><p class="eyebrow">NOW PLAYING</p><h2 id="player-title"></h2></div><button id="player-close" aria-label="再生を閉じる">✕</button></div><div id="media-host"></div><p id="player-message"></p></dialog><div id="toast" role="status" hidden></div>
</body></html>
